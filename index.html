<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Document</title>
    <!--Google Fonts-->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400..700&family=Playfair+Display:ital,wght@0,400..900;1,400..900&display=swap" rel="stylesheet">
</head>
<body>
    <main id="mainContainer">

        <h1 id="loadingText" class="puntosSuspensivos">JOINING SERVER</h1>

        <audio id="musicPlayer"></audio>

        <div id="volumeControllers">
            <button id="volDown">-</button>
            <span id="volActual">50%</span>
            <button id="volUp">+</button>
        </div>

        <p id="muteInstructions">Presiona espacio para <span id="muteStatus">mutear</span></p>

        <video autoplay muted id="backgroundVideo">
            <source src="assets/background.mp4" type="video/mp4">Tu navegador no soporta el vídeo de fondo de pantalla.
        </video>

        <footer id="links">
            <a href="https://discord.com">Discord</a>
            <a href="https://youtube.com">Youtube</a>
            <a href="https://instagram.com">Instagram</a>
        </footer>

    </main>
    <script src="script.js"></script>
</body>
</html>
